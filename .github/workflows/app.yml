# Publica la app (carpeta app/) en Cloudflare Pages y deja configurado el login con Google en Supabase.
# Necesita los secretos CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET
# (además de los de Supabase). Si todavía no están, avisa y no hace nada.
name: App

on:
  push:
    branches: [main]
    paths: ['app/**', 'package.json', 'package-lock.json', 'scripts/copiar_librerias.mjs', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      PROYECTO_PAGES: fadefil-sistema
    steps:
      - uses: actions/checkout@v4
      - name: ¿Están los secretos?
        id: secretos
        run: |
          FALTAN=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do [ -z "${!s}" ] && FALTAN="$FALTAN $s"; done
          if [ -n "$FALTAN" ]; then echo "::warning::Faltan los secretos:$FALTAN. La app no se publica hasta cargarlos."; echo "listo=no" >> $GITHUB_OUTPUT; else echo "listo=si" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.secretos.outputs.listo == 'si'
        with:
          node-version: 22
      - name: Librerías del navegador (supabase-js, pdf.js, ExcelJS) a app/lib
        if: steps.secretos.outputs.listo == 'si'
        run: npm ci && node scripts/copiar_librerias.mjs
      - name: Armar config.js (dirección y clave pública de Supabase)
        if: steps.secretos.outputs.listo == 'si'
        run: |
          CLAVE=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            | jq -r '([.[] | select(.name == "anon")] + [.[] | select(.type == "publishable")])[0].api_key')
          [ -n "$CLAVE" ] && [ "$CLAVE" != "null" ] || { echo "No se pudo leer la clave pública de Supabase"; exit 1; }
          printf "window.FADEFIL_CONFIG = { supabaseUrl: 'https://%s.supabase.co', supabaseKey: '%s' };\n" "$SUPABASE_PROJECT_REF" "$CLAVE" > app/config.js
          rm -f app/config.ejemplo.js
      - name: Publicar en Cloudflare Pages
        if: steps.secretos.outputs.listo == 'si'
        run: |
          npx --yes wrangler@3 pages project create "$PROYECTO_PAGES" --production-branch main 2>&1 | tail -2 || true
          npx --yes wrangler@3 pages deploy app --project-name "$PROYECTO_PAGES" --branch main --commit-dirty=true
      - name: Configurar el login con Google en Supabase
        if: steps.secretos.outputs.listo == 'si'
        run: |
          SUB=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROYECTO_PAGES" | jq -r '.result.subdomain')
          [ -n "$SUB" ] && [ "$SUB" != "null" ] || { echo "No se pudo leer la dirección de la app en Cloudflare"; exit 1; }
          URL="https://$SUB"
          jq -n --arg url "$URL" --arg id "$GOOGLE_CLIENT_ID" --arg sec "$GOOGLE_CLIENT_SECRET" \
            '{site_url: $url, uri_allow_list: ($url + "/**"), external_google_enabled: true, external_google_client_id: $id, external_google_secret: $sec, disable_signup: false,
              external_email_enabled: false, external_phone_enabled: false,
              hook_before_user_created_enabled: true, hook_before_user_created_uri: "pg-functions://postgres/public/hook_antes_de_crear_usuario"}' > auth.json
          # Solo Google; y antes de crear una cuenta, Supabase pregunta a la base si el mail está en Usuarios.
          CODIGO=$(curl -s -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" -d @auth.json -o resp.json -w "%{http_code}")
          rm -f auth.json
          if [ "$CODIGO" != "200" ]; then echo "Supabase no aceptó la configuración del login ($CODIGO):"; jq -r '.message // .msg // "sin detalle"' resp.json; rm -f resp.json; exit 1; fi
          rm -f resp.json
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            | jq -e '{google: .external_google_enabled, mail_y_clave: .external_email_enabled, solo_usuarios_habilitados: .hook_before_user_created_enabled, funcion: .hook_before_user_created_uri}
                     | ., (if .google and (.mail_y_clave | not) and .solo_usuarios_habilitados then true else error("La configuración del login no quedó como se esperaba") end)'
          echo "### La app está en $URL" >> $GITHUB_STEP_SUMMARY
          echo "La app está en $URL"
      - name: Comprobar la app y el login
        if: steps.secretos.outputs.listo == 'si'
        run: |
          SUB=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROYECTO_PAGES" | jq -r '.result.subdomain')
          sleep 20
          for p in index.html co2.html datos.html config.js lib/supabase.js lib/pdf.min.mjs lib/exceljs.min.js; do
            echo "$p: $(curl -s -o /dev/null -w '%{http_code}' "https://$SUB/$p")"
          done
          DEST=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://$SUPABASE_PROJECT_REF.supabase.co/auth/v1/authorize?provider=google&redirect_to=https://$SUB/")
          echo "Login con Google: $DEST" | sed 's/client_id=[^&]*/client_id=…/'
          echo "$DEST" | grep -q 'accounts.google.com' || { echo "El login con Google no redirige a Google"; exit 1; }
