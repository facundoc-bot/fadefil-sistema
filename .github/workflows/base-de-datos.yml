# Aplica las migraciones de supabase/migrations a la base de Supabase.
# Primero las prueba en un PostgreSQL descartable (tests/db/probar.sh); si fallan, no toca la base.
name: Base de datos

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'tests/db/**', '.github/workflows/base-de-datos.yml']
  workflow_dispatch:

concurrency:
  group: base-de-datos
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probar las migraciones en un PostgreSQL local
        run: bash tests/db/probar.sh

  aplicar:
    needs: probar
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Aplicar migraciones pendientes
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
